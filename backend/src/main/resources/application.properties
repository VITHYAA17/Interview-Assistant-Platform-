spring.application.name=prepwise-backend
server.port=8080

# Google Gemini Configuration
# Reads GEMINI_API_KEY from environment variables, or empty if not provided
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-1.5-flash}

# In-Memory H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:prepwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (Accessible at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# CORS Configuration
cors.allowed.origins=http://localhost:3000,http://127.0.0.1:3000,https://interview-assistant-platform.vercel.app
